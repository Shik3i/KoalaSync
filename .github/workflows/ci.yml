name: CI

# Runs the full verification suite (lint, unit/integration tests, production
# audits, extension + website build) on every push to main and every PR, so a
# regression can never reach main or a release tag unchecked.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes. Unlike the release
# workflow, an interrupted CI run has no side effects.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      # The server test suite (test-server-ws/routes/ops) imports express,
      # socket.io, and dotenv from server/node_modules, so install them too.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run verification suite
        run: npm run verify

  node20:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up lowest supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run unit and relay integration gates
        run: |
          npm run test:coverage
          node scripts/test-server-routes.mjs
          node scripts/test-server-ws.mjs
        env:
          ADMIN_METRICS_TOKEN: verify-admin-token-with-more-than-32-chars

  e2e:
    # Kept separate from `verify`: this job needs a downloaded browser, so a
    # failure here should read as "the browser flow broke", not as a broken
    # lint or unit run. `verify` stays usable offline and in the release job.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chromium-headless-shell firefox webkit

      # The extension specs load dist/chrome, so the artifact has to exist.
      - name: Build the extension
        run: npm run build:extension

      - name: Run cross-browser detection and extension E2E tests
        run: npm run test:e2e

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14
